[project]
name = "sensor-readings"
version = "0.1.0"
description = "HTTP service that accepts room sensor readings and returns the latest reading per sensor"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.146.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.pytest]
testpaths = ["tests"]
strict = true
filterwarnings = ["error"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PT", "RET", "ASYNC", "FAST", "PL", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
