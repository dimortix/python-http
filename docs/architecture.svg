<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 450" width="1060" height="450" role="img" aria-label="Request flow: POST /readings validates the raw body with the Reading model in models.py, passes a valid Reading to ReadingStore.add in store.py, which checks and inserts into _events and replaces _latest only when the reading is newer. GET /sensors/{id}/latest reads _latest through latest_for.">
  <style>
    svg { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --box: #151b23; --line: #3d444d; --accent: #4493f8; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); font-size: 12px; }
    .bg { fill: var(--bg); }
    .container { fill: none; stroke: var(--line); stroke-width: 1.5; }
    .box { fill: var(--box); stroke: var(--line); stroke-width: 1; }
    .title { font-size: 13px; font-weight: 600; }
    .muted { fill: var(--muted); font-weight: 400; }
    .label { font-size: 11px; fill: var(--muted); }
    .edge { stroke: var(--fg); stroke-width: 1.4; fill: none; }
    .dashed { stroke-dasharray: 5 4; }
    .accent { stroke: var(--accent); }
    .accent-text { fill: var(--accent); }
    .head { fill: var(--fg); }
    .head-accent { fill: var(--accent); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="head"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="head-accent"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1060" height="450" rx="12"/>

  <rect class="box" x="20" y="95" width="90" height="305" rx="8"/>
  <text class="title" x="65" y="240" text-anchor="middle">Client</text>
  <text class="label" x="65" y="258" text-anchor="middle">curl, tests</text>

  <rect class="container" x="170" y="40" width="270" height="390" rx="10"/>
  <text class="title" x="188" y="66">main.py<tspan class="muted"> · HTTP layer</tspan></text>

  <rect class="box" x="190" y="95" width="230" height="125" rx="6"/>
  <text class="title" x="305" y="120" text-anchor="middle">POST /readings</text>
  <text x="305" y="146" text-anchor="middle">201 accepted</text>
  <text x="305" y="164" text-anchor="middle">200 duplicate</text>
  <text x="305" y="182" text-anchor="middle">409 conflict</text>
  <text x="305" y="200" text-anchor="middle">422 invalid body</text>

  <rect class="box" x="190" y="300" width="230" height="100" rx="6"/>
  <text class="title" x="305" y="326" text-anchor="middle">GET /sensors/{id}/latest</text>
  <text x="305" y="352" text-anchor="middle">200 latest reading</text>
  <text x="305" y="370" text-anchor="middle">404 no readings</text>

  <line class="edge" x1="110" y1="130" x2="188" y2="130" marker-end="url(#arrow)"/>
  <text class="label" x="140" y="123" text-anchor="middle">request</text>
  <line class="edge" x1="190" y1="180" x2="112" y2="180" marker-end="url(#arrow)"/>
  <text class="label" x="140" y="173" text-anchor="middle">response</text>
  <line class="edge" x1="110" y1="335" x2="188" y2="335" marker-end="url(#arrow)"/>
  <text class="label" x="140" y="328" text-anchor="middle">request</text>
  <line class="edge" x1="190" y1="375" x2="112" y2="375" marker-end="url(#arrow)"/>
  <text class="label" x="140" y="368" text-anchor="middle">response</text>

  <rect class="container" x="510" y="40" width="530" height="150" rx="10"/>
  <text class="title" x="528" y="66">models.py<tspan class="muted"> · validation</tspan></text>

  <rect class="box" x="530" y="85" width="210" height="85" rx="6"/>
  <text class="title" x="635" y="110" text-anchor="middle">Reading</text>
  <text x="635" y="130" text-anchor="middle">strict types, no extra fields</text>
  <text x="635" y="148" text-anchor="middle">finite value, UTC time with Z</text>

  <rect class="box" x="830" y="85" width="190" height="85" rx="6"/>
  <text class="title" x="925" y="110" text-anchor="middle">parse_moment()</text>
  <text x="925" y="130" text-anchor="middle">whole seconds plus</text>
  <text x="925" y="148" text-anchor="middle">exact Decimal fraction</text>

  <line class="edge" x1="740" y1="127" x2="828" y2="127" marker-end="url(#arrow)"/>
  <text class="label" x="785" y="120" text-anchor="middle">observed_at</text>

  <rect class="container" x="510" y="230" width="530" height="200" rx="10"/>
  <text class="title" x="528" y="256">store.py<tspan class="muted"> · in-memory state</tspan></text>

  <rect class="box" x="530" y="275" width="210" height="60" rx="6"/>
  <text class="title" x="635" y="300" text-anchor="middle">ReadingStore.add()</text>
  <text x="635" y="319" text-anchor="middle">accepted / duplicate / conflict</text>

  <rect class="box" x="530" y="355" width="210" height="55" rx="6"/>
  <text class="title" x="635" y="379" text-anchor="middle">latest_for()</text>
  <text x="635" y="397" text-anchor="middle">returns Reading or None</text>

  <rect class="box" x="830" y="275" width="190" height="60" rx="6"/>
  <text class="title" x="925" y="300" text-anchor="middle">_events</text>
  <text x="925" y="319" text-anchor="middle">event_id → Reading</text>

  <rect class="box" x="830" y="355" width="190" height="55" rx="6"/>
  <text class="title" x="925" y="379" text-anchor="middle">_latest</text>
  <text x="925" y="397" text-anchor="middle">sensor_id → Reading</text>

  <line class="edge" x1="420" y1="127" x2="528" y2="127" marker-end="url(#arrow)"/>
  <text class="label" x="475" y="120" text-anchor="middle">validate</text>

  <polyline class="edge" points="420,200 470,200 470,305 528,305" marker-end="url(#arrow)"/>
  <text class="label" x="476" y="257">valid</text>

  <line class="edge" x1="420" y1="385" x2="528" y2="385" marker-end="url(#arrow)"/>
  <text class="label" x="475" y="378" text-anchor="middle">sensor_id</text>

  <line class="edge dashed" x1="725" y1="275" x2="725" y2="172" marker-end="url(#arrow)"/>
  <text class="label" x="733" y="214">same_as(), moment</text>

  <line class="edge" x1="740" y1="300" x2="828" y2="300" marker-end="url(#arrow)"/>
  <text class="label" x="785" y="293" text-anchor="middle">find, insert</text>

  <line class="edge accent" x1="740" y1="325" x2="828" y2="372" marker-end="url(#arrow-accent)"/>
  <text class="label accent-text" x="793" y="333" text-anchor="middle">if newer</text>

  <line class="edge" x1="740" y1="385" x2="828" y2="385" marker-end="url(#arrow)"/>
  <text class="label" x="785" y="378" text-anchor="middle">get</text>
</svg>
